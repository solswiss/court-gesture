<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sand Volley</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; width: 100vw; }
      .hud-top {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        min-width: max-content;
        width: 100%;
        position: absolute; 
        top: 14px; 
        left: 50%;
        transform: translateX(-50%);
      }
      .hud-island {
        align-items: center;
        text-align: center;
        /* border-radius: 200px;
        border: 2px solid #fff; */
        background: transparent;
        display: flex;
        flex-direction: row;
        width: 24em;
        font-weight: 600; 
        color: #fff;
        text-shadow: 
            -1px -1px 0 #000,  
            1px -1px 0 #000,
            -1px  1px 0 #000,
            1px  1px 0 #000;
        .hud-island-home-label,
          .hud-island-away-label {
          padding: 0 16px;
          width: 4ch;
          font-size: 20px;
        }
        .hud-score {
          font-size: 28px; 
          letter-spacing: .02em; 
          font-size: 42px;
          width: 100%;
          text-align: center;
          line-height: 1.2;
        }
      }
      .hud-bay {
        display: flex;
        flex-direction: row;
        border-radius: 200px;
        border: 2px solid #fff;
        padding: 8px;
      }
      .hud-touches { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: .9; }
      .hud-hit { position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; opacity: 0; transition: opacity .25s; }
      .hud-hit.show { opacity: 1; }
      .hud-hit.q3 { color: #ffee55; } .hud-hit.q2 { color: #fff; } .hud-hit.q1 { color: #ffc27a; } .hud-hit.q0 { color: #ff7766; }
      .hud-debug { position: absolute; top: 80px; left: 12px; font: 12px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; }
      .hud-help { position: absolute; left: 12px; top: 10px; font-size: 12px; line-height: 1.6; opacity: .92; background: transparent; padding: 0; margin: 0; border-radius: 8px; width: max-content;
        ul {
          list-style: none;
          text-align: start;
          font-size: 14px;
          font-weight: bold; 
          color: #fff;
          text-shadow: 
            -1px -1px 0 #000,  
            1px -1px 0 #000,
            -1px  1px 0 #000,
            1px  1px 0 #000;
        }
      }
      .menu-toggle { position: absolute; z-index: 8; bottom: 12px; right: 12px; padding: 10px 18px; border: 1px solid #ffffff80; border-radius: 20px; background: #152131df; color: white; cursor: pointer; }
      .game-menu { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: #10273799; backdrop-filter: blur(6px); }
      .game-menu[hidden] { display: none; }
      .game-menu-card { width: min(400px, 100%); max-height: 85vh; overflow: auto; box-sizing: border-box; background: #fff5dd; color: #183849; padding: 28px; border-radius: 22px; box-shadow: 0 16px 60px #10273766; display: grid; gap: 14px; }
      .game-menu-card h1, .game-menu-card p { margin: 0; }
      .game-menu-card h1 { font-size: 32px; letter-spacing: -1px; }
      .game-menu-card label { display: flex; align-items: center; gap: 10px; }
      .game-menu-card select { margin-left: auto; padding: 8px; border-radius: 8px; }
      .game-menu-card button { padding: 12px; border: 0; border-radius: 10px; background: #176b76; color: white; font: inherit; cursor: pointer; }
      .game-menu-card button:disabled { opacity: .5; cursor: default; }
      .menu-help { font-size: 13px; line-height: 1.6; }
      .network-panel { position: absolute; z-index: 6; left: 12px; bottom: 12px; max-width: min(420px, 90vw); padding: 10px; border-radius: 8px; color: white; background: #152131dd; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
      .network-panel strong, .network-panel div { width: 100%; }
      .network-panel input { min-width: 0; width: 180px; }
      .network-panel input[readonly] { width: 100%; }
      .network-panel[hidden], .network-panel [hidden] { display: none; }
      .network-panel button, .network-panel input { padding: 6px; border-radius: 4px; border: 0; }
      .hand-panel { position: absolute; z-index: 5; right: 12px; top: 12px; width: min(270px, 42vw); box-sizing: border-box; padding: 12px; border-radius: 12px; background: transparent; color: white; font-size: 13px; display: grid; gap: 8px; }
      .hand-button-panel {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .hand-panel video { width: 100%; max-height: 150px; object-fit: cover; transform: scaleX(-1); border-radius: 6px; background: #152131; }
      .hand-panel button { padding: 8px; cursor: pointer; border: 0; border-radius: 6px; }
      .hand-panel small { line-height: 1.4; color: #cbdce7; }
      .hud-help { max-width: calc(58vw - 48px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
