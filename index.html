<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sand Volley</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; width: 100vw; }
      .hud-top {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        min-width: max-content;
        width: 20%;
        position: absolute; 
        top: 14px; 
        left: 50%;
        transform: translateX(-50%);
      }
      .hud-island {
        align-items: center;
        text-align: center;
        /* border-radius: 200px;
        border: 2px solid #fff; */
        background: transparent;
        display: grid;
        grid-template-columns: 22% 56% 22%;
        place-items: center;
        width: 80%;
        font-weight: 600; 
        color: #fff;
        text-shadow: 
            -1px -1px 0 #000,  
            1px -1px 0 #000,
            -1px  1px 0 #000,
            1px  1px 0 #000;
        .hud-island-home-label,
          .hud-island-away-label {
          padding: 0 16px;
          width: 4ch;
          font-size: 20px;
        }
        .hud-score {
          font-size: 28px; 
          letter-spacing: .02em; 
          font-size: 42px;
          width: 100%;
          text-align: center;
          line-height: 1.2;
        }
      }
      .hud-bay {
        display: flex;
        flex-direction: row;
        border-radius: 200px;
        border: 2px solid #fff;
        padding: 8px;
      }
      .hud-touches { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: .9; }
      .hud-hit { position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; opacity: 0; transition: opacity .25s; }
      .hud-hit.show { opacity: 1; }
      .hud-hit.q3 { color: #ffee55; } .hud-hit.q2 { color: #fff; } .hud-hit.q1 { color: #ffc27a; } .hud-hit.q0 { color: #ff7766; }
      .hud-debug { position: absolute; top: 80px; left: 12px; font: 12px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; }
      .hud-help { position: absolute; left: 12px; top: 10px; font-size: 12px; line-height: 1.6; opacity: .92; background: transparent; padding: 0; margin: 0; border-radius: 8px; width: max-content;
        ul {
          list-style: none;
          text-align: start;
          font-size: 14px;
          font-weight: bold; 
          color: #fff;
          text-shadow: 
            -1px -1px 0 #000,  
            1px -1px 0 #000,
            -1px  1px 0 #000,
            1px  1px 0 #000;
        }
      }
      .hand-panel { position: absolute; z-index: 5; right: 12px; top: 12px; width: min(270px, 42vw); box-sizing: border-box; padding: 12px; border-radius: 12px; background: transparent; color: white; font-size: 13px; display: grid; gap: 8px; }
      .hand-button-panel {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .hand-panel video { width: 100%; max-height: 150px; object-fit: cover; transform: scaleX(-1); border-radius: 6px; background: #152131; }
      .hand-panel button { padding: 8px; cursor: pointer; border: 0; border-radius: 6px; }
      .hand-panel small { line-height: 1.4; color: #cbdce7; }
      .hud-help { max-width: calc(58vw - 48px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
