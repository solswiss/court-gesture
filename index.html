<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sand Volley</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); }
      .hud-score { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 800; letter-spacing: .04em; }
      .hud-touches { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: .9; }
      .hud-status { position: absolute; top: 28%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; text-align: center; transition: opacity .15s; opacity: 0; }
      .hud-hit { position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; opacity: 0; transition: opacity .25s; }
      .hud-hit.show { opacity: 1; }
      .hud-hit.q3 { color: #ffee55; } .hud-hit.q2 { color: #fff; } .hud-hit.q1 { color: #ffc27a; } .hud-hit.q0 { color: #ff7766; }
      .hud-debug { position: absolute; top: 80px; left: 12px; font: 12px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; }
      .hud-help { position: absolute; left: 12px; bottom: 10px; font-size: 12px; line-height: 1.6; opacity: .92; background: rgba(0,0,0,.28); padding: 6px 10px; border-radius: 8px; }
      .hand-panel { position: absolute; z-index: 5; right: 12px; bottom: 12px; width: min(270px, 42vw); box-sizing: border-box; padding: 12px; border-radius: 12px; background: rgba(12,25,40,.88); color: white; font-size: 13px; display: grid; gap: 8px; }
      .hand-panel video { width: 100%; max-height: 150px; object-fit: cover; transform: scaleX(-1); border-radius: 6px; background: #152131; }
      .hand-panel button { padding: 8px; cursor: pointer; border: 0; border-radius: 6px; }
      .hand-panel small { line-height: 1.4; color: #cbdce7; }
      .hud-help { max-width: calc(58vw - 48px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
